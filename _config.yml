title: Data for Greece
description: Aνακάλυψε την Ελλάδα μέσα από δεδομένα
baseurl: "" # Base URL (e.g., /blog if hosted at example.com/blog)
url: "https://dataforgreece.gr"
author: DataForGreece
email: support@justdataplease.com
include: [ '_shortlinks','_charts/en','_charts/gr', '_reports/en','_reports/gr','_articles/en','_articles/gr','_data_directory/en','_data_directory/gr','_topics/en','_topics/gr' ]
exclude: [ 'README.md', 'sync-content.ps1', 'Gemfile', 'Gemfile.lock', 'node_modules', 'vendor',
           # posts left out of this edition (kept in the main site, so sync-content still copies them)
           '_articles/gr/forest-fires-greece-dv-2025-04.md', '_articles/en/forest-fires-greece-dv-2025-04.md' ]

# ── Newspaper edition ───────────────────────────────────────────────
# Two looks for the same content (definitions in _data/themes.yml):
#   classic – black ink on white, column rules
#   salmon  – "pink paper" financial daily: salmon paper, data ticker
newspaper:
  theme: classic
  theme_switcher: true   # "Edition" picker in the top bar; set false once you pick one
  founded: 2024          # first year of publication, drives the "Vol." in the dateline

google_analytics: G-VT1VMYFGDL

collections:
  articles:
    output: true
  reports:
    output: true
  data_directory:
    output: true
  charts:
    output: true
  topics:            # newspaper only: topic pages (data in _data/topics.yml)
    output: true

defaults:
  - scope:
      path: "_topics/gr"
    values:
      lang: "gr"
      layout: "topic"
      permalink: /dedomena/:slug/
  - scope:
      path: "_topics/en"
    values:
      lang: "en"
      layout: "topic"
      permalink: /en/data/:slug/
  - scope:
      path: "_articles/en"
    values:
      lang: "en"
      layout: "post"
      permalink: /en/blog/:slug/
  - scope:
      path: "_articles/gr"
    values:
      lang: "gr"
      layout: "post"
      permalink: /blog/:slug/
  - scope:
      path: "_reports/en"
    values:
      lang: "en"
      layout: "report"
      categories: "reports"
      permalink: /en/reports/:slug/
  - scope:
      path: "_reports/gr"
    values:
      lang: "gr"
      layout: "report"
      categories: "reports"
      permalink: /reports/:slug/
  - scope:
      path: "_charts/en"
    values:
      lang: "en"
      layout: "chart"
      categories: "charts"
      permalink: /en/charts/:slug/
  - scope:
      path: "_charts/gr"
    values:
      lang: "gr"
      layout: "chart"
      categories: "charts"
      permalink: /charts/:slug/
  - scope:
      path: "_data_directory/en"
    values:
      lang: "en"
      layout: "data"
      categories: "data-directory"
      permalink: /en/data-directory/:slug/
  - scope:
      path: "_data_directory/gr"
    values:
      lang: "gr"
      layout: "data"
      categories: "data-directory"
      permalink: /data-directory/:slug/

plugins:
  - jekyll-redirect-from

languages:
  default: "gr"
  en:
    label: "English"
    path: "/en"

permalink: pretty


kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  math_engine: mathjax
  show_warnings: false
  tables: true
