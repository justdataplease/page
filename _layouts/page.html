{% include head.html %}
<body>
{% include masthead.html %}

<main>
    <article class="article wrap">
        <header class="article__head">
            <nav class="crumbs" aria-label="breadcrumb">
                <a href="{{ site.baseurl }}{{ t.paths.home }}">{{ t.home }}</a>
                <span aria-current="page">{{ page.title_upper | default: page.title }}</span>
            </nav>
            <h1 class="hl hl--article">{{ page.title }}</h1>
            {%- if page.dek %}<p class="dek">{{ page.dek }}</p>{% endif %}
        </header>
        <div class="prose">
            {{ content }}
        </div>
    </article>
</main>

{% include footer.html %}
</body>
</html>
