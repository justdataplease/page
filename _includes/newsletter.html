<aside class="coupon{% if include.wide %} coupon--wide{% endif %}">
    <p class="coupon__eyebrow"><span aria-hidden="true">✂</span> {{ t.coupon_eyebrow }}</p>
    <h2 class="coupon__title">{{ t.nl_title }}</h2>
    <p class="coupon__text">{{ t.nl_text }}</p>
    <a class="btn" href="{{ t.substack }}" target="_blank" rel="noopener noreferrer">{{ t.subscribe }}</a>
</aside>
