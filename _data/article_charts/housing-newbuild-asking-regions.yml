# housing-new-buildings-2026-10: median asking price per m2 in our sale listings of the last 12 complete months, homes
# built 2015 or later vs before 1980, Greece and each region (akinita.price_by_feature, feature "Έτος κατασκευής";
# Western Macedonia left out: too few new-build listings). Checked 2026-10-21.
type: dumbbell
unit: " €"
max: 6000
decimals: 0
