  en: "Median asking price in the sale listings of the last 12 months. Source: property listings. Processing: DataForGreece."
series:
  - name: {gr: "Χτισμένα από το 2015", en: "Built 2015 or later"}
  - name: {gr: "Χτισμένα πριν το 1980", en: "Built before 1980"}
