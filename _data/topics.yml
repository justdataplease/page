      - "Είναι ζητούμενες τιμές αγγελιών, όχι τιμές συναλλαγών· οι πράξεις κλείνουν συνήθως χαμηλότερα. Για τις τιμές συναλλαγών δείτε το θέμα Κατοικία (Τράπεζα της Ελλάδος)."
      - "Οι δήμοι με λίγες αγγελίες δεν εμφανίζονται, ώστε μία-δύο ακριβές βίλες να μη «φτιάχνουν» την τιμή ενός ολόκληρου δήμου."
      - "Τα ενοίκια συγκρίνονται με το Airbnb στη σελίδα «Airbnb & ενοίκια» του θέματος Airbnb."
      - "Η σελίδα «Αγγελίες και επίσημα στοιχεία» βάζει τις ζητούμενες τιμές δίπλα στις τιμές συναλλαγών της Τράπεζας της Ελλάδος, στις αγοραπωλησίες και τις άδειες της ΕΛΣΤΑΤ και στο εισόδημα των νοικοκυριών."
  en:
    name: "Property asking prices"
    dek: "What sellers and landlords ask for a home, by region and municipality, every month since 2022: price per m², the typical home and rental yield."
    coverage: "2022 – today · all of Greece · 13 regions · municipalities"
    updates: "Every month"
    sources:
      - { name: "DataForGreece", url: "https://dataforgreece.gr/en/data/real-estate/", note: "Our own collection of homes listed for sale and for rent" }
      - { name: "Bank of Greece", url: "https://www.bankofgreece.gr/en/statistics/real-estate-market/residential-and-commercial-property-price-indices-and-other-short-term-indices", note: "Apartment price index (transactions)" }
