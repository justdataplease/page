      - { name: "Eurostat", url: "https://ec.europa.eu/eurostat/databrowser/view/nama_10r_2hhinc/default/table?lang=en", note: "Household income and housing cost overburden by region" }
    notes:
      - "These are asking prices from listings, not sale prices; deals usually close lower. For transaction prices see the Housing topic (Bank of Greece)."
      - "Municipalities with few listings are left out, so one or two expensive villas cannot set a whole municipality's price."
      - "Rents are compared with Airbnb on the «Airbnb & ενοίκια» page of the Airbnb topic."
      - "The page «Αγγελίες και επίσημα στοιχεία» puts asking prices next to the Bank of Greece transaction prices, ELSTAT's property sales and building permits, and household income."

