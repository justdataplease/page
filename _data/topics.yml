- key: real-estate
  kind: topic
  category: prices
  model: akinita
  image: assets/posts/topic-real-estate.webp
  since: 2022
  cadence: monthly
  data: [real-estate-greece, auctions-greece, property-transfers-greece]
  charts: []
  report: ""
  articles: []
  dashboards: { lite: "", full: "https://app.powerbi.com/view?r=eyJrIjoiMDU3ZmQxMWMtZjk1Yy00YzgzLWE5ZTItZjkyZDU3ZTA4MjM3IiwidCI6IjAzMTVmMTIzLTFlOGQtNDVhYi04N2M0LWNlZTljODA1NTE4OSIsImMiOjl9" }
  gr:
    name: "Ακίνητα: αγγελίες, συμβόλαια και πλειστηριασμοί"
    dek: "Τι ζητούν οι αγγελίες πώλησης και ενοικίασης σε κάθε δήμο, τι δηλώνεται στα συμβόλαια και από πού ξεκινούν οι πλειστηριασμοί."
    coverage: "2022 – σήμερα · όλη η Ελλάδα · 13 περιφέρειες · δήμοι"
    updates: "Κάθε μήνα"
    sources:
      - { name: "DataForGreece", url: "https://dataforgreece.gr/dedomena/real-estate/", note: "Δικές μας συλλογές αγγελιών πώλησης και ενοικίασης κατοικιών και πλειστηριασμών ακινήτων" }
      - { name: "Υπουργείο Οικονομικών (ΑΑΔΕ)", url: "https://www.gsis.gr/sites/default/files/akinhta/mhtrwo-ax-met-ak-2025.xlsx", note: "Μητρώο συμβολαίων μεταβίβασης ακινήτων: δηλωμένη τιμή, εμβαδόν, ηλικία και τιμή ζώνης" }
      - { name: "Τράπεζα της Ελλάδος", url: "https://www.bankofgreece.gr/en/statistics/real-estate-market/residential-and-commercial-property-price-indices-and-other-short-term-indices", note: "Δείκτης τιμών διαμερισμάτων (συναλλαγές)" }
      - { name: "ΕΛΣΤΑΤ", url: "https://www.statistics.gr/el/statistics/-/publication/SJU24/-", note: "Αγοραπωλησίες ακινήτων και οικοδομικές άδειες" }
      - { name: "Eurostat", url: "https://ec.europa.eu/eurostat/databrowser/view/nama_10r_2hhinc/default/table?lang=en", note: "Εισόδημα νοικοκυριών και επιβάρυνση από το κόστος στέγασης ανά περιφέρεια" }
    notes:
      - "Είναι ζητούμενες τιμές αγγελιών, όχι τιμές συναλλαγών· οι πράξεις κλείνουν συνήθως χαμηλότερα. Τις τιμές συναλλαγών της Τράπεζας της Ελλάδος θα τις βρείτε στο θέμα «Στέγαση και οικοδομή»."
      - "Οι δήμοι με λίγες αγγελίες δεν εμφανίζονται, ώστε μία-δύο ακριβές βίλες να μη «φτιάχνουν» την τιμή ενός ολόκληρου δήμου."
      - "Η δηλωμένη τιμή των συμβολαίων αφορά κυρίως παλιά σπίτια, γι' αυτό η απόστασή της από τις αγγελίες δεν είναι «έκπτωση». Οι δήμοι συγκρίνονται μόνο όταν το όνομά τους ταυτίζεται στις δύο πηγές."
      - "Πλειστηριασμοί: το αποτέλεσμα δεν το βλέπουμε, το συμπεραίνουμε. Όταν το ακίνητο αποσύρεται αμέσως μετά χωρίς νέο γύρο, το λέμε «πιθανή κατακύρωση». Συγκρίνουμε την τιμή πρώτης προσφοράς, όχι την τελική, με τις ζητούμενες τιμές για τον ίδιο τύπο κατοικίας στην ίδια περιοχή· δεν είναι επίσημος δείκτης τιμών."
  en:
    name: "Property: listings, contracts and auctions"
    dek: "What listings ask to buy and to rent in every municipality, what is declared in the contracts and where property auctions start."
    coverage: "2022 – today · all of Greece · 13 regions · municipalities"
    updates: "Every month"
    sources:
      - { name: "DataForGreece", url: "https://dataforgreece.gr/en/data/real-estate/", note: "Our own collection of homes listed for sale and for rent, and of property auctions" }
      - { name: "Ministry of Finance (AADE)", url: "https://www.gsis.gr/sites/default/files/akinhta/mhtrwo-ax-met-ak-2025.xlsx", note: "Register of property transfer contracts: declared price, area, age and zone price" }
      - { name: "Bank of Greece", url: "https://www.bankofgreece.gr/en/statistics/real-estate-market/residential-and-commercial-property-price-indices-and-other-short-term-indices", note: "Apartment price index (transactions)" }
      - { name: "ELSTAT", url: "https://www.statistics.gr/en/statistics/-/publication/SJU24/-", note: "Property sales and building permits" }
      - { name: "Eurostat", url: "https://ec.europa.eu/eurostat/databrowser/view/nama_10r_2hhinc/default/table?lang=en", note: "Household income and housing cost overburden by region" }
    notes:
      - "These are asking prices from listings, not sale prices; deals usually close lower. The Bank of Greece transaction prices are in the «Housing and construction» topic."
      - "Municipalities with few listings are left out, so one or two expensive villas cannot set a whole municipality's price."
      - "The declared contract price is mostly for older homes, so its gap to the listings is not a «discount». Municipalities are compared only when their names match in both sources."
      - "Auctions: we don't see the outcome, we infer it. When a property is withdrawn right after the auction with no new round, we call it a «likely sale». We compare the starting bid, not the final price, with asking prices for the same home type in the same area; it is not an official price index."

