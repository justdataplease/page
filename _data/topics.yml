# The site's topics ("Θέματα") and special topics ("Ειδικά θέματα").
#
# kind: topic    an ongoing subject: always-up-to-date dashboards + sources, and an edition of
#                analysis on a fixed schedule (cadence: quarterly | semiannual | annual | special)
# kind: special  a one-off, event-like feature (a campaign, an event), with its date
#
# Each one gets a page at /themata/<key>/ (and /en/topics/<key>/), made from _topics/<lang>/<key>.md.
# Links to the rest of the site:
#   data      data_directory slugs (dataset pages)
#   charts    chart slugs to embed while the topic's own dashboard is not published yet (Power BI only)
#   report    a _reports slug, used as the full-screen dashboard page
#   articles  article slugs that belong here; a new article can instead say `topic: <key>` in its front matter,
#             plus `edition: quarterly|semiannual|annual|special` and `period: 2026-Q3 | 2026-H1 | 2026 | 2026-10`
#   dashboards.lite / .full   the Power BI "publish to web" links of <model>_lite.pbix / <model>_full.pbix
#                             (C:\MyDrive\jdp\models); empty until published
#   explore   the older detailed reports (<model>_scrapeit.pbix, published as <model>), for inspecting every number
# Only Power BI is embedded on this site (no Looker Studio).

- key: fuel-prices
  kind: topic
  model: gas_prices
  image: assets/posts/fuel_station.webp
  since: 2012
  cadence: quarterly
  data: [fuel-prices-greece]
  charts: []
  report: ""
  articles: [fuel-prices-greece-timeline]
  dashboards: { lite: "", full: "https://app.powerbi.com/view?r=eyJrIjoiZmU1OWQ4MjMtZmQyYS00YzM1LWJhYjEtNzFiOTE4ZjEyYmE0IiwidCI6IjAzMTVmMTIzLTFlOGQtNDVhYi04N2M0LWNlZTljODA1NTE4OSIsImMiOjl9" }
  gr:
    name: "Τιμές καυσίμων"
    dek: "Αμόλυβδη, diesel, υγραέριο και πετρέλαιο θέρμανσης: οι μέσες τιμές λιανικής σε όλη τη χώρα και σε κάθε νομό, από το 2012 μέχρι σήμερα."
    coverage: "2012 – σήμερα · 51 νομοί"
    updates: "Κάθε τρίμηνο"
    sources:
      - { name: "Παρατηρητήριο Τιμών Υγρών Καυσίμων, Υπουργείο Ανάπτυξης", url: "https://www.fuelprices.gr", note: "Ημερήσια και εβδομαδιαία δελτία (PDF)" }
      - { name: "e-katanalotis (αρχείο 2021–2024)", url: "https://e-katanalotis.gov.gr", note: "Τιμές πρατηρίων ανά εταιρεία" }
    notes:
      - "Οι τιμές είναι σταθμισμένοι μέσοι όροι του Υπουργείου· δεν προστίθενται μεταξύ τους."
      - "Οι εθνικές τιμές και οι τιμές ανά νομό είναι διαφορετικές σειρές και δεν αναμειγνύονται."
  en:
    name: "Fuel prices"
    dek: "Unleaded, diesel, LPG and heating oil: average retail prices for the whole country and every prefecture, from 2012 to today."
    coverage: "2012 – today · 51 prefectures"
    updates: "Every quarter"
    sources:
      - { name: "Observatory of Liquid Fuel Prices, Ministry of Development", url: "https://www.fuelprices.gr", note: "Daily and weekly bulletins (PDF)" }
      - { name: "e-katanalotis (2021–2024 archive)", url: "https://e-katanalotis.gov.gr", note: "Station prices by brand" }
    notes:
      - "Prices are the Ministry's weighted averages; they are never added together."
      - "National and per-prefecture prices are separate series and are not mixed."

