    notes:
      - "The resident population is not the electoral roll: an area's registered voters can far outnumber its residents."
      - "A region's change in population is not internal migration: it includes births, deaths and moves to and from abroad. Migration here is international only."
      - "1821 is a retrospective estimate, not a census, and the historical milestones each cover a different territory; they do not form a continuous series."
