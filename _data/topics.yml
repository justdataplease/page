    notes:
      - "Οι στάθμες είναι dB της συσκευής, χωρίς βαθμονόμηση: δείχνουν διαφορές ανάμεσα σε τόπους και ώρες, όχι επίσημες μετρήσεις θορύβου, και δεν συγκρίνονται με νομικά όρια ή με άλλα όργανα."
