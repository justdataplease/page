# The two editions. Each one is a block of CSS variables + overrides in
# assets/css/newspaper.css, selected with <html data-theme="...">.
# `fonts` are Google Fonts css2 family specs; every face supports Greek.

classic:
  name: "Classic"
  blurb:
    gr: "Κλασική ασπρόμαυρη εφημερίδα"
    en: "Classic black-and-white broadsheet"
  fonts:
    - "Oswald:wght@500..700"
    - "Noto+Serif+Display:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900"
    - "Noto+Serif:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900"
    - "Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900"
    - "Fira+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400"

salmon:
  name: "Salmon"
  blurb:
    gr: "Οικονομική εφημερίδα σε ροζ χαρτί"
    en: "Pink-paper financial daily"
  fonts:
    - "Oswald:wght@500..700"
    - "Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900"
    - "Inter:wght@400..700"
